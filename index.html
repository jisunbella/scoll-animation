<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <style>
    body {
      background: black;
      height: 6000px;
    }

    div {
      margin-top: 1000px;
      color: white;
      text-align: center;
      font-size: 70px;
      opacity: 0;
      transform: rotate(-720deg);
      transition: all 1s;
    }
  </style>

  <div>Hello</div>
  <div>I am</div>
  <div>Jisun</div>
  <div>Nice to meet you</div>

  <script>
    let observer = new IntersectionObserver((e) => {
      // 감시 중 박스가 화면에 등장하면 여기 코드 실행해줌
      e.forEach((param) => {
        // 애니메이션은 transition 사용함
        if (param.isIntersecting) { // 화면에 보일때만 실행
          param.target.style.opacity = 1;
          param.target.style.transform = 'rotate(0deg)';
        } else {
          param.target.style.opacity = 0;
        }
        param.intersectionRatio // 해당 박스가 화면에 몇퍼센트 등장하는지 알려줌
      });
    });

    let div = document.querySelectorAll('div');

    observer.observe(div[0]); // html 요소가 화면에 등장 & 퇴장하는지 감시해줌
    observer.observe(div[1]);
    observer.observe(div[2]);
    observer.observe(div[3]);

    // scroll-timeline 알아보기

  </script>

</body>

</html>
